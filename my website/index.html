<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>
  <style>
    /* Reset and general styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    header p {
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    /* Gallery Grid Layout */
    .gallery-container {
      display: grid;
      /* Automatically fits columns based on screen width */
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Gallery Items */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: #fff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover effect on cards */
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 250px; /* Fixed height for consistency */
      object-fit: cover; /* Keeps image proportions without stretching */
      display: block;
      transition: transform 0.3s ease;
    }

    /* Zoom effect on image hover */
    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Optional Caption styling */
    .caption {
      padding: 12px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Gallery</h1>
    <p>A collection of fucked up moments</p>
  </header>

  <main class="gallery-container">

    <!-- Image Item 1 -->
    <div class="gallery-item">
      <!-- REPLACE 'your-image-1.jpg' with the filename/path of your image -->
      <img src="image/jade.jpg" alt="Description of Image 1">
      <div class="caption">Yuck Shit</div>
    </div>

    <!-- Image Item 2 -->
    <div class="gallery-item">
      <img src="image/Birthday boi.png" alt="Description of Image 2">
      <div class="caption">Daddy i want spiderman</div>
    </div>

    <!-- Image Item 3 -->
    <div class="gallery-item">
      <img src="image/sad boy.jpg" alt="Description of Image 3">
      <div class="caption">yung inaya ka na nya ng 1 round pero di ka pa tuli</div>
    </div>

    <!-- Image Item 4 -->
    <div class="gallery-item">
      <img src="image/haaa.jpg" alt="Description of Image 4">
      <div class="caption">First time ma-experience 'yung 5G connection sa utak.</div>
    </div>

    <!-- Image Item 5 -->
    <div class="gallery-item">
      <img src="image/pauwi na ako.jpg" alt="Description of Image 5">
      <div class="caption">hays! pano na to sira nanaman bike ko</div>
    </div>

    <!-- Image Item 6 -->
    <div class="gallery-item">
      <img src="image/tulog.jpg" alt="Description of Image 6">
      <div class="caption">manahimik ang lahat nag dadasal ako</div>
    </div>

  </main>

</body>
</html>
